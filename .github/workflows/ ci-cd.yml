# Должно быть так:
name: BlogCore CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, 3.10]

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Run tests
      run: |
        python -m pytest test_blogcore.py -v

    - name: Test application startup
      run: |
        python app.py &
        sleep 3
        curl -f http://localhost:8000/health || exit 1

  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8

    - name: Lint with flake8
      run: |
        flake8 app.py test_blogcore.py --max-line-length=100 --ignore=E302,E305,W293

  build:
    needs: [test, lint]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verify all files are present
      run: |
        ls -la
        ls -la templates/
        [ -f app.py ] && echo "app.py exists" || exit 1
        [ -f requirements.txt ] && echo "requirements.txt exists" || exit 1
        [ -f test_blogcore.py ] && echo "test_blogcore.py exists" || exit 1

    - name: Create deployment package
      run: |
        mkdir -p deployment
        cp app.py requirements.txt test_blogcore.py deployment/
        cp -r templates deployment/
        cp -r assets deployment/
        tar -czf blogcore-deployment.tar.gz deployment/

    - name: Upload deployment artifact
      uses: actions/upload-artifact@v3
      with:
        name: blogcore-app
        path: blogcore-deployment.tar.gz
        retention-days: 30