name: BlogCore CI - Quality & Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: '3.11'

jobs:
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pylint

      - name: Run Pylint
        run: |
          echo "🔍 Running Pylint..."
          pylint app.py \
                 --disable=C0111,C0103,R0903,W0212,C0114,C0115,C0116 \
                 --max-line-length=120 \
                 --ignore=__pycache__,.venv || true
          echo "✅ Pylint completed"

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Create test data files
        run: |
          echo "[]" > users_data.json
          echo "[]" > articles_data.json

      - name: Run Tests with Coverage
        run: |
          echo "🧪 Running tests..."
          pytest test_blogcore.py \
                 --maxfail=5 \
                 --disable-warnings \
                 -v \
                 --cov=. \
                 --cov-report=term-missing \
                 --cov-report=xml
          echo "✅ Tests completed"

      - name: Upload coverage reports
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-blogcore

      - name: Test application startup
        run: |
          echo "🚀 Testing application startup..."
          timeout 30 python app.py &
          APP_PID=$!
          sleep 5
          curl -f http://localhost:8000/health || (kill $APP_PID && exit 1)
          kill $APP_PID
          echo "✅ Application startup test passed"

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          echo "🐳 Building Docker image..."
          docker build -t blogcore:latest .
          echo "✅ Docker image built successfully"

      - name: Test Docker Image
        run: |
          echo "🧪 Testing Docker image..."
          docker compose up -d
          sleep 5
          curl -f http://localhost:8000/health || exit 1
          docker compose down
          echo "✅ Docker image test passed"

      - name: Save Docker Image
        run: |
          docker save blogcore:latest | gzip > blogcore-docker-image.tar.gz

      - name: Upload Docker Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: blogcore-docker-image
          path: blogcore-docker-image.tar.gz
          retention-days: 30

  package:
    name: Create Deployment Package
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Package application
        run: |
          echo "📦 Creating deployment package..."
          mkdir -p deployment
          cp app.py requirements.txt deployment/
          cp Dockerfile docker-compose.yml deployment/
          [ -f test_blogcore.py ] && cp test_blogcore.py deployment/ || true
          cp -r templates deployment/
          cp -r assets deployment/
          
          # Create empty data files
          echo "[]" > deployment/users_data.json
          echo "[]" > deployment/articles_data.json
          
          # Create deployment script
          cat > deployment/deploy.sh << 'EOF'
          #!/bin/bash
          set -e
          echo "🚀 Starting deployment..."
          echo "Stopping existing containers..."
          docker compose down || true
          echo "Building and starting new containers..."
          docker compose up -d --build
          echo "✅ Deployment complete!"
          EOF
          chmod +x deployment/deploy.sh
          
          # Create README
          cat > deployment/README.md << 'EOF'
          # BlogCore Deployment Package
          
          ## Quick Start
          ```bash
          ./deploy.sh
          ```
          
          ## Manual Deployment
          ```bash
          docker compose up -d --build
          ```
          
          ## Files Included
          - app.py - Main application
          - requirements.txt - Python dependencies
          - Dockerfile - Docker configuration
          - docker-compose.yml - Docker Compose configuration
          - templates/ - HTML templates
          - assets/ - Static assets
          - deploy.sh - Automated deployment script
          ```
          EOF
          
          tar -czf blogcore-deployment-${{ github.sha }}.tar.gz deployment/
          echo "✅ Package created successfully"

      - name: Upload Deployment Artifact
        uses: actions/upload-artifact@v4
        with:
          name: blogcore-deployment-${{ github.sha }}
          path: blogcore-deployment-${{ github.sha }}.tar.gz
          retention-days: 30